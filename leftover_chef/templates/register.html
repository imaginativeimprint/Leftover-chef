<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Leftover Chef</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://tint.creativemarket.com/sl3-ef8dqGKQ_JyTvdQWPikmVGUycPzuIYxSEqljPdc/width:1820/height:1206/gravity:ce/rt:fill-down/el:1/preset:cm_watermark_retina/czM6Ly9maWxlcy5jcmVhdGl2ZW1hcmtldC5jb20vaW1hZ2VzL3NjcmVlbnNob3RzL3Byb2R1Y3RzLzEyMzUvMTIzNTUvMTIzNTUzMTcvMy0wOTcxMy1vLmpwZw?1711382318');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: #2c3b4b;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-size: 1.7rem;
            text-align: center;
            margin-bottom: 0.5rem;
            color: #2c3b4b;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #ff7055;
            box-shadow: 0 0 0 3px rgba(255, 112, 85, 0.15);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: #ff7055;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #2c3b4b;
            transform: translateY(-2px);
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .links a {
            color: #ff7055;
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h1>Create Account</h1>
        <div class="subtitle">Start cooking smarter</div>

        <!-- Flask/Jinja Error Message -->
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name"
                    name="name" 
                    required 
                    placeholder="John Doe"
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email"
                    name="email" 
                    required 
                    placeholder="you@example.com"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    required 
                    placeholder="Create a password"
                >
            </div>

            <button type="submit">Sign Up →</button>
        </form>

        <div class="links">
            <a href="/login">Already have an account? Login</a>
        </div>
    </div>
</body>
</html>
